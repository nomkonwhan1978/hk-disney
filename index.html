<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HK Disneyland VIP Guide & DPA Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --header-bg: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    --card: #1e293b;
    --card-active: #27354f;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --gold: #f59e0b;
    --gold-bg: rgba(245, 158, 11, 0.15);
    --blue: #38bdf8;
    --blue-bg: rgba(56, 189, 248, 0.15);
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.15);
    --map-bg: #131c31;
    --label-bg: rgba(15, 23, 42, 0.88);
    --label-text: #ffffff;
  }

  /* โหมดสู้แดดกลางแจ้ง (High-Contrast Light Mode) */
  body.light-mode {
    --bg: #f1f5f9;
    --header-bg: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
    --card: #ffffff;
    --card-active: #eff6ff;
    --border: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --gold: #d97706;
    --gold-bg: #fef3c7;
    --blue: #0284c7;
    --blue-bg: #e0f2fe;
    --green: #059669;
    --green-bg: #d1fae5;
    --map-bg: #e2e8f0;
    --label-bg: rgba(255, 255, 255, 0.95);
    --label-text: #0f172a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; transition: background 0.25s, color 0.25s; }

  header {
    background: var(--header-bg);
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    color: #ffffff;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  h1 { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }
  
  .dpa-bar {
    background: rgba(0,0,0,0.28);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid rgba(251, 191, 36, 0.4);
  }
  .dpa-label { font-size: 0.82rem; color: #fde68a; font-weight: 600; }
  .dpa-dots { display: flex; gap: 5px; margin-top: 4px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1.5px solid #fbbf24; transition: 0.3s; }
  .dot.used { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
  .dpa-count { font-size: 1.05rem; font-weight: 800; color: #fbbf24; }

  .map-section { padding: 12px 16px 0; position: relative; }
  .map-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .facility-toggle {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: 0.2s;
  }
  .facility-toggle.active {
    background: #0284c7;
    color: #ffffff;
    border-color: #0284c7;
  }
  .zoom-hint { font-size: 0.75rem; color: var(--text-muted); }

  .map-wrapper {
    background: var(--map-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    touch-action: none;
    height: 265px;
  }
  svg { width: 100%; height: 100%; display: block; transform-origin: 0 0; }
  
  .zoom-controls {
    position: absolute;
    bottom: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 10;
  }
  .zoom-btn {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid #64748b;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
  }
  .zoom-info {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(15, 23, 42, 0.78);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.72rem;
    color: #38bdf8;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes dashMove { to { stroke-dashoffset: -24; } }
  .nav-route {
    stroke: #ef4444;
    stroke-width: 3;
    stroke-dasharray: 6, 6;
    fill: none;
    animation: dashMove 1s linear infinite;
  }
  @keyframes pulseRing {
    0% { r: 6; opacity: 1; }
    100% { r: 18; opacity: 0; }
  }
  .pulse-circle { fill: none; stroke: #ef4444; stroke-width: 2.5; animation: pulseRing 1.5s infinite; }
  .pin-group { cursor: pointer; }

  .pin-label-bg {
    fill: var(--label-bg);
    stroke: var(--gold);
    stroke-width: 0.8px;
    rx: 3.5px;
  }
  .pin-label-text {
    font-size: 4.8px;
    font-weight: 700;
    fill: var(--label-text);
    text-anchor: middle;
    pointer-events: none;
  }
  .pin-group.done .pin-label-bg { opacity: 0.5; stroke: #64748b; }
  .pin-group.done .pin-label-text { opacity: 0.6; text-decoration: line-through; }

  .nav-banner {
    margin: 12px 16px;
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    color: #ffffff;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
  }
  .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 6px; flex-wrap: wrap; }
  .nav-time { background: #fff; color: #0369a1; font-weight: 800; padding: 2px 8px; border-radius: 6px; font-size: 0.82rem; }
  .nav-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .badge-dpa { background: #fbbf24; color: #000; }
  .badge-std { background: rgba(255,255,255,0.2); color: #fff; }
  .nav-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
  .nav-dir { display: flex; align-items: flex-start; gap: 8px; background: rgba(0,0,0,0.22); padding: 8px 10px; border-radius: 8px; font-size: 0.84rem; line-height: 1.4; }
  .dir-arrow { font-size: 1.25rem; line-height: 1; }
  .nav-tip { font-size: 0.78rem; color: #e0f2fe; margin-top: 8px; }

  /* แถบตัวกรองรายการ */
  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 4px 16px 8px;
    overflow-x: auto;
  }
  .filter-btn {
    background: var(--card);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
  }
  .filter-btn.active {
    background: var(--blue);
    color: #ffffff;
    border-color: var(--blue);
  }

  .timeline { padding: 0 16px; }
  .phase-title {
    font-size: 0.78rem;
    letter-spacing: 0.3px;
    color: var(--blue);
    margin: 14px 0 8px;
    font-weight: 700;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: 0.2s;
    cursor: pointer;
  }
  .card.selected { background: var(--card-active); border-color: var(--blue); box-shadow: 0 0 0 1.5px var(--blue); }
  .card.done { opacity: 0.55; }
  .card.done .item-name { text-decoration: line-through; }

  .check-box {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 2px solid #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    font-weight: bold;
    color: transparent;
    transition: 0.2s;
  }
  .card.done .check-box { background: var(--green); border-color: var(--green); color: #fff; }

  .card-body { flex: 1; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .time-tag { font-size: 0.78rem; font-weight: 700; color: var(--blue); }
  .tag-dpa { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold); font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: 700; }
  .tag-std { background: var(--blue-bg); color: var(--blue); font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
  .tag-food { background: var(--green-bg); color: var(--green); font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
  
  .item-name { font-size: 0.94rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .item-zone { font-size: 0.76rem; color: var(--text-muted); margin-bottom: 4px; }
  .item-note { font-size: 0.79rem; color: var(--text-muted); line-height: 1.35; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🏰 HK Disneyland VIP Plan</h1>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">☀️ สู้แดด</button>
      <button class="icon-btn" onclick="resetProgress()">รีเซ็ต</button>
    </div>
  </div>
  <div class="dpa-bar">
    <div>
      <div class="dpa-label">🎟️ สิทธิ์ Premier Access (8 เครื่องเล่น)</div>
      <div class="dpa-dots" id="dpaDots"></div>
    </div>
    <div class="dpa-count" id="dpaCount">0 / 8</div>
  </div>
</header>

<div class="map-section">
  <div class="map-toolbar">
    <button class="facility-toggle" id="facilityBtn" onclick="toggleFacilities()">🚻💧 แสดงห้องน้ำ / จุดเติมน้ำ</button>
    <span class="zoom-hint">ใช้ 2 นิ้วถ่างซูมแผนที่ได้</span>
  </div>
  <div class="map-wrapper" id="mapWrapper">
    <div class="zoom-info" id="zoomInfo">ซูม: 100%</div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoom(0.3)">+</button>
      <button class="zoom-btn" onclick="zoom(-0.3)">-</button>
      <button class="zoom-btn" onclick="resetZoom()">1x</button>
    </div>

      <!-- 2. Fantasyland (บนกลาง) -->
      <path d="M 162,15 L 278,15 L 268,90 L 152,90 Z" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
      <circle cx="215" cy="42" r="14" fill="#f472b6" opacity="0.5"/>
      <text x="215" y="12" fill="#7e22ce" font-size="6.5" font-weight="800" text-anchor="middle">FANTASYLAND</text>

      <!-- 3. Tomorrowland (ขวาทั้งหมด) -->

      <text x="332" y="50" fill="#0e7490" font-size="6.5" font-weight="800" text-anchor="middle">TOMORROWLAND</text>

      <!-- 4. Toy Story Land (ซ้ายกลาง) -->
      <path d="M 20,84 L 132,84 L 132,135 L 20,135 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
      <text x="76" y="81" fill="#c2410c" font-size="6.2" font-weight="800" text-anchor="middle">TOY STORY LAND</text>

      <!-- 5. Mystic Point (ซ้ายล่างบน) -->
      <path d="M 20,141 L 118,141 L 118,186 L 20,186 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
      <text x="69" y="139" fill="#15803d" font-size="6.2" font-weight="800" text-anchor="middle">MYSTIC POINT</text>

      <!-- 6. Grizzly Gulch (ซ้ายล่างสุด) -->
      <path d="M 20,192 L 130,192 L 130,240 L 20,240 Z" fill="#fed7aa" stroke="#b45309" stroke-width="1.5"/>
      <text x="75" y="190" fill="#92400e" font-size="6.2" font-weight="800" text-anchor="middle">GRIZZLY GULCH</text>

      <!-- 7. Adventureland (ล่างกลางซ้าย) -->
      <path d="M 136,142 L 192,142 L 192,215 L 136,215 Z" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
      <circle cx="164" cy="178" r="16" fill="#38bdf8" opacity="0.45"/>
      <circle cx="164" cy="178" r="8" fill="#15803d"/>
      <text x="164" y="139" fill="#047857" font-size="6" font-weight="800" text-anchor="middle">ADVENTURELAND</text>

      <!-- 8. Castle & Main Street U.S.A. (แกนกลาง) -->

      <rect x="190" y="138" width="20" height="92" rx="4" fill="#fecdd3" stroke="#e11d48" stroke-width="1.2"/>
      <text x="200" y="185" fill="#9f1239" font-size="5.5" font-weight="800" text-anchor="middle" transform="rotate(-90 200,185)">MAIN STREET U.S.A.</text>

      <!-- ปราสาทตรงกลาง -->
      <circle cx="200" cy="115" r="18" fill="#fbcfe8" stroke="#db2777" stroke-width="1.8"/>
      <polygon points="193,120 200,100 207,120" fill="#db2777"/>
      <text x="200" y="128" fill="#831843" font-size="5.5" font-weight="900" text-anchor="middle">CASTLE</text>

      <!-- ทางเข้าหลัก -->
      <rect x="172" y="232" width="56" height="13" rx="4" fill="#dc2626"/>
      <text x="200" y="241" fill="#ffffff" font-size="6.5" font-weight="bold" text-anchor="middle">ทางเข้า / ออก (GATE)</text>

      <!-- ชั้นข้อมูลเส้นทาง หมุดเครื่องเล่น และจุดสิ่งอำนวยความสะดวก -->
      <g id="routeLayer"></g>
      <g id="facilitiesLayer" style="display:none;"></g>
      <g id="pinsLayer"></g>
    </svg>
  </div>
</div>

<div class="nav-banner" id="navBanner"></div>

<!-- แถบตัวกรองรายการ -->
<div class="filter-bar">
  <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">ทั้งหมด (14)</button>
  <button class="filter-btn" id="filter-dpa" onclick="setFilter('dpa')">🎟️ Premier Access (8)</button>
  <button class="filter-btn" id="filter-todo" onclick="setFilter('todo')">⏳ ยังไม่เล่น</button>
</div>

<div class="timeline" id="timelineContainer"></div>

// ----------------- ระบบ Zoom & Pan (สองนิ้วถ่างขยาย) -----------------
let scale = 1, startScale = 1;
let translateX = 0, translateY = 0, startX = 0, startY = 0;
let isPanning = false;
let touches = [];

const mapWrapper = document.getElementById('mapWrapper');
const parkMap = document.getElementById('parkMap');
const zoomInfo = document.getElementById('zoomInfo');

function updateTransform() {
  scale = Math.max(1, Math.min(scale, 4.5));
  const rect = mapWrapper.getBoundingClientRect();
  const maxX = rect.width * (scale - 1);
  const maxY = rect.height * (scale - 1);
  translateX = Math.max(-maxX, Math.min(0, translateX));
  translateY = Math.max(-maxY, Math.min(0, translateY));
  
  parkMap.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  zoomInfo.innerText = `ซูม: ${Math.round(scale * 100)}%`;
}

mapWrapper.addEventListener('touchstart', (e) => {
  touches = Array.from(e.touches);
  if (touches.length === 1) {
    isPanning = true;
    startX = touches[0].clientX - translateX;
    startY = touches[0].clientY - translateY;
  } else if (touches.length === 2) {
    isPanning = false;
    startScale = scale;
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    mapWrapper.dataset.dist = Math.sqrt(dx * dx + dy * dy);
  }
});

mapWrapper.addEventListener('touchmove', (e) => {
  const currentTouches = Array.from(e.touches);
  if (isPanning && currentTouches.length === 1) {
    translateX = currentTouches[0].clientX - startX;
    translateY = currentTouches[0].clientY - startY;
    updateTransform();
  } else if (currentTouches.length === 2) {
    const dx = currentTouches[0].clientX - currentTouches[1].clientX;
    const dy = currentTouches[0].clientY - currentTouches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const startDist = parseFloat(mapWrapper.dataset.dist) || dist;
    
    scale = startScale * (dist / startDist);
    updateTransform();
  }
});

mapWrapper.addEventListener('touchend', () => { isPanning = false; });

function zoom(amount) {
  scale += amount;
  updateTransform();
}
function resetZoom() {
  scale = 1; translateX = 0; translateY = 0;
  updateTransform();
}

// ----------------- ระบบยืนยันก่อนกดทุกครั้ง -----------------
function saveState() {
  localStorage.setItem('hkdl_done', JSON.stringify(completedIds));
  localStorage.setItem('hkdl_selected', selectedId);
}

function toggleDone(e, id) {
  e.stopPropagation();
  const step = itinerary.find(item => item.id === id);
  const isCurrentlyDone = completedIds.includes(id);

  if (!isCurrentlyDone) {
    if (!confirm(`ยืนยันว่าทำภารกิจที่ ${id} (${step.name}) สำเร็จแล้วใช่ไหม?`)) return;
    completedIds.push(id);
    const nextStep = itinerary.find(item => item.id > id && !completedIds.includes(item.id));
    if (nextStep) selectedId = nextStep.id;
  } else {
    if (!confirm(`ต้องการยกเลิกการติ๊กถูกภารกิจที่ ${id} (${step.name}) ใช่หรือไม่?`)) return;
    completedIds = completedIds.filter(item => item !== id);
  }
  
  saveState();
  renderAll();
}

function selectStep(id) {
  selectedId = id;
  saveState();
  renderAll();
}

function resetProgress() {
  if (confirm('⚠️ คำเตือน: ต้องการล้างข้อมูลที่ติ๊กไว้และสิทธิ์บัตร Premier Access ทั้งหมดใช่หรือไม่?')) {
    completedIds = [];
    selectedId = 1;
    saveState();
    renderAll();
  }
}

// ----------------- ระบบแสดงผล -----------------
function renderFacilities() {
  const layer = document.getElementById('facilitiesLayer');
  layer.innerHTML = '';
  facilities.forEach(f => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", f.x - 16);
    rect.setAttribute("y", f.y - 5);
    rect.setAttribute("width", 32);
    rect.setAttribute("height", 9);
    rect.setAttribute("rx", 4);
    rect.setAttribute("fill", "#0284c7");
    rect.setAttribute("stroke", "#ffffff");
    rect.setAttribute("stroke-width", "0.8");
    g.appendChild(rect);

    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", f.x);
    txt.setAttribute("y", f.y + 1.5);
    txt.setAttribute("text-anchor", "middle");
    txt.setAttribute("font-size", "4.5");
    txt.setAttribute("font-weight", "bold");
    txt.setAttribute("fill", "#ffffff");
    txt.textContent = f.label;
    g.appendChild(txt);
    layer.appendChild(g);
  });
}

function renderDPA() {
  const usedDpaCount = itinerary.filter(i => i.type === 'dpa' && completedIds.includes(i.id)).length;
  document.getElementById('dpaCount').innerText = `${usedDpaCount} / 8`;
  
  const dotsContainer = document.getElementById('dpaDots');
  dotsContainer.innerHTML = '';
  for (let i = 1; i <= 8; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i <= usedDpaCount ? ' used' : '');
    dotsContainer.appendChild(dot);
  }
}

function renderMap() {
  const routeLayer = document.getElementById('routeLayer');
  const pinsLayer = document.getElementById('pinsLayer');
  routeLayer.innerHTML = '';
  pinsLayer.innerHTML = '';

  const currentIdx = itinerary.findIndex(i => i.id === selectedId);
  const currentStep = itinerary[currentIdx];
  const prevStep = currentIdx > 0 ? itinerary[currentIdx - 1] : { x: 200, y: 232 };

  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", prevStep.x);
  line.setAttribute("y1", prevStep.y);
  line.setAttribute("x2", currentStep.x);
  line.setAttribute("y2", currentStep.y);
  line.setAttribute("class", "nav-route");
  routeLayer.appendChild(line);

  const angle = Math.atan2(currentStep.y - prevStep.y, currentStep.x - prevStep.x);
  const arrowDist = 13;
  const ax = currentStep.x - Math.cos(angle) * arrowDist;
  const ay = currentStep.y - Math.sin(angle) * arrowDist;
  const deg = angle * (180 / Math.PI);

  const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  arrow.setAttribute("points", "-5,-4 5,0 -5,4");
  arrow.setAttribute("fill", "#ef4444");
  arrow.setAttribute("stroke", "#ffffff");
  arrow.setAttribute("stroke-width", "0.8");
  arrow.setAttribute("transform", `translate(${ax},${ay}) rotate(${deg})`);
  routeLayer.appendChild(arrow);

  itinerary.forEach(item => {
    const isDone = completedIds.includes(item.id);
    const isSelected = item.id === selectedId;

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "pin-group" + (isDone ? " done" : ""));
    g.onclick = () => selectStep(item.id);

    if (isSelected) {
      const pulse = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      pulse.setAttribute("cx", item.x);
      pulse.setAttribute("cy", item.y);
      pulse.setAttribute("class", "pulse-circle");
      g.appendChild(pulse);
    }

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", item.x);
    circle.setAttribute("cy", item.y);
    circle.setAttribute("r", isSelected ? "7.5" : "5.8");
    
    let fill = "#0284c7";
    if (item.type === 'dpa') fill = "#f59e0b";
    if (item.type === 'food') fill = "#10b981";
    if (isDone) fill = "#64748b";

    circle.setAttribute("fill", fill);
    circle.setAttribute("stroke", "#ffffff");
    circle.setAttribute("stroke-width", isSelected ? "2" : "1.2");
    g.appendChild(circle);

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", item.x);
    text.setAttribute("y", item.y + 2.3);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "7");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("fill", "#ffffff");
    text.textContent = isDone ? "✓" : item.id;
    g.appendChild(text);

    // ป้ายชื่อลอยเหนือหมุด
    const labelY = item.y - 11;
    const txtLen = item.shortName.length * 2.6 + 10;

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", item.x - (txtLen / 2));
    rect.setAttribute("y", labelY - 4.8);
    rect.setAttribute("width", txtLen);
    rect.setAttribute("height", 7.8);
    rect.setAttribute("class", "pin-label-bg");
    g.appendChild(rect);

    const lblText = document.createElementNS("http://www.w3.org/2000/svg", "text");
    lblText.setAttribute("x", item.x);
    lblText.setAttribute("y", labelY + 1.1);
    lblText.setAttribute("class", "pin-label-text");
    lblText.textContent = `${item.id}. ${item.shortName}`;
    g.appendChild(lblText);

    pinsLayer.appendChild(g);
  });
}

function renderBanner() {
  const step = itinerary.find(i => i.id === selectedId);
  const banner = document.getElementById('navBanner');
  
  let badgeHtml = `<span class="nav-badge badge-std">ต่อคิวปกติ (Standby)</span>`;
  if (step.type === 'dpa') {
    badgeHtml = `<span class="nav-badge badge-dpa">⚡ ใช้บัตร Premier Access (สิทธิ์ที่ ${step.dpaNum}/8)</span>`;
  } else if (step.type === 'food') {
    badgeHtml = `<span class="nav-badge badge-std">🍽️ พักทานอาหาร</span>`;
  }

  banner.innerHTML = `
    <div class="nav-header">
      <span class="nav-time">⏰ ควรเข้าเวลา ${step.time}</span>
      ${badgeHtml}
    </div>
    <div class="nav-title">${step.id}. ${step.name}</div>
    <div class="nav-dir">
      <span class="dir-arrow">${step.arrow}</span>
      <span><strong>เส้นทางเดิน:</strong> ${step.direction}</span>
    </div>
    <div class="nav-tip">💡 ${step.note}</div>
  `;
}

function renderTimeline() {
  const container = document.getElementById('timelineContainer');
  container.innerHTML = '';
  let currentPhase = '';

  const filteredList = itinerary.filter(item => {
    if (currentFilter === 'dpa') return item.type === 'dpa';
    if (currentFilter === 'todo') return !completedIds.includes(item.id);
    return true;
  });

  if (filteredList.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 30px; color: var(--text-muted);">🎉 เก็บครบทุกรายการในหมวดนี้แล้ว!</div>`;
    return;
  }

  filteredList.forEach(item => {
    if (item.phase !== currentPhase) {
      currentPhase = item.phase;
      const pDiv = document.createElement('div');
      pDiv.className = 'phase-title';
      pDiv.innerHTML = `📍 ${currentPhase}`;
      container.appendChild(pDiv);
    }

    const isDone = completedIds.includes(item.id);
    const isSelected = item.id === selectedId;

    let tagHtml = `<span class="tag-std">ต่อคิวปกติ</span>`;
    if (item.type === 'dpa') tagHtml = `<span class="tag-dpa">⚡ Premier Access #${item.dpaNum}</span>`;
    if (item.type === 'food') tagHtml = `<span class="tag-food">🍽️ พักกลางวัน</span>`;

    const card = document.createElement('div');
    card.className = `card ${isSelected ? 'selected' : ''} ${isDone ? 'done' : ''}`;
    card.onclick = () => selectStep(item.id);

    card.innerHTML = `
      <div class="check-box" onclick="toggleDone(event, ${item.id})">✓</div>
      <div class="card-body">
        <div class="card-top">
          <span class="time-tag">${item.time} • ลำดับที่ ${item.id}</span>
          ${tagHtml}
        </div>
        <div class="item-name">${item.name}</div>
        <div class="item-zone">โซน: ${item.zone}</div>
        <div class="item-note">${item.note}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function renderAll() {
  renderFacilities();
  renderDPA();
  renderMap();
  renderBanner();
  renderTimeline();
}

renderAll();
