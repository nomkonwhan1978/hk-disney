<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HK Disneyland VIP Guide & DPA Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-active: #27354f;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --gold: #f59e0b;
    --gold-bg: rgba(245, 158, 11, 0.15);
    --blue: #38bdf8;
    --blue-bg: rgba(56, 189, 248, 0.15);
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.15);
    --purple: #a855f7;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }

  /* Header & DPA Counter */
  header {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  h1 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .reset-btn { background: rgba(255,255,255,0.1); border: none; color: #cbd5e1; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
  
  .dpa-bar {
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid rgba(245, 158, 11, 0.3);
  }
  .dpa-label { font-size: 0.85rem; color: #fde68a; font-weight: 600; }
  .dpa-dots { display: flex; gap: 5px; margin-top: 4px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #334155; border: 1.5px solid var(--gold); transition: 0.3s; }
  .dot.used { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .dpa-count { font-size: 1.1rem; font-weight: 800; color: var(--gold); }

  /* Map Container */
  .map-section { padding: 12px 16px 0; }
  .map-wrapper {
    background: #131c31;
    border-radius: 16px;
    border: 1px solid #334155;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }
  svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  
  /* SVG Animations */
  @keyframes dashMove { to { stroke-dashoffset: -24; } }
  .nav-route {
    stroke: #38bdf8;
    stroke-width: 3.5;
    stroke-dasharray: 6, 6;
    fill: none;
    animation: dashMove 1s linear infinite;
    filter: drop-shadow(0 0 4px #38bdf8);
  }
  @keyframes pulseRing {
    0% { r: 8; opacity: 0.9; }
    100% { r: 20; opacity: 0; }
  }
  .pulse-circle { fill: none; stroke: #38bdf8; stroke-width: 2.5; animation: pulseRing 1.5s infinite; }
  .pin-group { cursor: pointer; transition: transform 0.2s; }
  .pin-group:hover { transform: scale(1.1); }

  /* Navigation Instruction Banner */
  .nav-banner {
    margin: 12px 16px;
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .nav-time { background: #fff; color: #0369a1; font-weight: 800; padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; }
  .nav-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .badge-dpa { background: var(--gold); color: #000; }
  .badge-std { background: rgba(255,255,255,0.2); color: #fff; }
  .nav-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
  .nav-dir { display: flex; align-items: flex-start; gap: 8px; background: rgba(0,0,0,0.25); padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; line-height: 1.4; }
  .dir-arrow { font-size: 1.3rem; line-height: 1; }
  .nav-tip { font-size: 0.8rem; color: #e0f2fe; margin-top: 8px; }

  /* Timeline List */
  .timeline { padding: 4px 16px; }
  .phase-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--blue);
    margin: 16px 0 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #334155;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: 0.2s;
    cursor: pointer;
  }
  .card.selected { background: var(--card-active); border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .card.done { opacity: 0.55; background: #0f172a; }
  .card.done .item-name { text-decoration: line-through; }

  .check-box {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    font-weight: bold;
    color: transparent;
    transition: 0.2s;
  }
  .card.done .check-box { background: var(--green); border-color: var(--green); color: #fff; }

  .card-body { flex: 1; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .time-tag { font-size: 0.8rem; font-weight: 700; color: var(--blue); }
  .tag-dpa { background: var(--gold-bg); color: var(--gold); border: 1px solid rgba(245,158,11,0.4); font-size: 0.7rem; padding: 2px 6px; border-radius: 5px; font-weight: 700; }
  .tag-std { background: var(--blue-bg); color: var(--blue); font-size: 0.7rem; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
  .tag-food { background: var(--green-bg); color: var(--green); font-size: 0.7rem; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
  
  .item-name { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .item-zone { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; }
  .item-note { font-size: 0.8rem; color: #cbd5e1; line-height: 1.35; }
</style>
</head>

let completedIds = JSON.parse(localStorage.getItem('hkdl_done') || '[]');
let selectedId = parseInt(localStorage.getItem('hkdl_selected')) || 1;

function saveState() {
  localStorage.setItem('hkdl_done', JSON.stringify(completedIds));
  localStorage.setItem('hkdl_selected', selectedId);
}

function toggleDone(e, id) {
  e.stopPropagation();
  if (completedIds.includes(id)) {
    completedIds = completedIds.filter(item => item !== id);
  } else {
    completedIds.push(id);
    // Auto advance to next uncompleted step
    const nextStep = itinerary.find(item => item.id > id && !completedIds.includes(item.id));
    if (nextStep) selectedId = nextStep.id;
  }
  saveState();
  renderAll();
}

function selectStep(id) {
  selectedId = id;
  saveState();
  renderAll();
}

function resetProgress() {
  if (confirm('ต้องการรีเซ็ตสถานะการเล่นและสิทธิ์บัตร Premier Access ทั้งหมดใช่ไหม?')) {
    completedIds = [];
    selectedId = 1;
    saveState();
    renderAll();
  }
}

  const usedDpaCount = itinerary.filter(i => i.type === 'dpa' && completedIds.includes(i.id)).length;
  document.getElementById('dpaCount').innerText = `${usedDpaCount} / 8`;
  
  const dotsContainer = document.getElementById('dpaDots');
  dotsContainer.innerHTML = '';
  for (let i = 1; i <= 8; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i <= usedDpaCount ? ' used' : '');
    dotsContainer.appendChild(dot);
  }
}
