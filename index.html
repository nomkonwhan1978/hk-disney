<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>HK Disneyland VIP Guide & DPA Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --header-bg: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    --card: #1e293b;
    --card-active: #27354f;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --gold: #f59e0b;
    --gold-bg: rgba(245, 158, 11, 0.15);
    --blue: #38bdf8;
    --blue-bg: rgba(56, 189, 248, 0.15);
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.15);
    --map-bg: #131c31;
    --label-bg: rgba(15, 23, 42, 0.78);
    --label-text: #ffffff;
  }

  body.light-mode {
    --bg: #f1f5f9;
    --header-bg: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
    --card: #ffffff;
    --card-active: #eff6ff;
    --border: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --gold: #d97706;
    --gold-bg: #fef3c7;
    --blue: #0284c7;
    --blue-bg: #e0f2fe;
    --green: #059669;
    --green-bg: #d1fae5;
    --map-bg: #e2e8f0;
    --label-bg: rgba(255, 255, 255, 0.86);
    --label-text: #0f172a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); padding-bottom: 40px; -webkit-tap-highlight-color: transparent; transition: background 0.25s, color 0.25s; }

  header { background: var(--header-bg); padding: 14px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.25); color: #ffffff; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  h1 { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
  
  .dpa-bar { background: rgba(0,0,0,0.28); border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(251, 191, 36, 0.4); }
  .dpa-label { font-size: 0.82rem; color: #fde68a; font-weight: 600; }
  .dpa-dots { display: flex; gap: 5px; margin-top: 4px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1.5px solid #fbbf24; transition: 0.3s; }
  .dot.used { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
  .dpa-count { font-size: 1.05rem; font-weight: 800; color: #fbbf24; }

  .map-section { padding: 12px 16px 0; position: relative; }
  .map-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
  .toolbar-btn {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 20px; font-size: 0.74rem; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; flex: 1; text-align: center;
  }
  .toolbar-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; }
  .ride-picker-btn { background: rgba(245, 158, 11, 0.18); color: var(--gold); border-color: var(--gold); }
  .ride-picker-btn.active { background: var(--gold); color: #000000; border-color: var(--gold); }

  .ride-drawer {
    display: none;
    background: var(--card);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .ride-drawer.open { display: block; }
  .drawer-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .drawer-tab-btn {
    flex: 1;
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
  }
  .drawer-tab-btn.active {
    background: var(--blue);
    color: #ffffff;
    border-color: var(--blue);
  }
  .drawer-tab-btn.tab-premier.active {
    background: var(--gold);
    color: #000000;
    border-color: var(--gold);
  }
  .ride-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .ride-chip {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 16px;
    font-size: 0.74rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: 0.2s;
  }
  .ride-chip.selected {
    background: var(--gold);
    color: #000000;
    border-color: var(--gold);
    font-weight: 800;
  }

  .map-wrapper { background: var(--map-bg); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; position: relative; touch-action: none; height: 265px; }
  
  .map-wrapper.is-fullscreen {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100dvh;
    z-index: 9999;
    border-radius: 0;
    border: none;
  }
  @media screen and (orientation: portrait) {
    .map-wrapper.is-fullscreen {
      width: 100dvh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
      left: 100vw;
    }
  }

  svg { width: 100%; height: 100%; display: block; transform-origin: 0 0; }
  
  .zoom-controls { position: absolute; bottom: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; z-index: 50; }
  .bottom-btn-row { display: flex; gap: 6px; align-items: center; }
  .zoom-btn { background: rgba(15, 23, 42, 0.88); border: 1px solid #64748b; color: #fff; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  .fs-icon-btn {
    background: transparent;
    border: none;
    box-shadow: none;
    width: 26px;
    height: 26px;
    padding: 0;
  }
  
  .exit-fs-btn {
    display: none;
    position: absolute;
    top: 16px; right: 75px;
    background: transparent;
    border: none;
    box-shadow: none;
    color: #000000;
    width: 32px;
    height: 32px;
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1;
    z-index: 200;
    cursor: pointer;
    text-shadow: 0 0 3px rgba(255,255,255,0.9);
    align-items: center;
    justify-content: center;
  }
  .map-wrapper.is-fullscreen .exit-fs-btn { display: flex; }
  .map-wrapper.is-fullscreen .fs-icon-btn { display: none; }
  .map-wrapper.is-fullscreen .zoom-controls { bottom: 18px; right: 24px; }

  .zoom-info { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.78); padding: 4px 9px; border-radius: 6px; font-size: 0.72rem; color: #38bdf8; pointer-events: none; z-index: 20; }

  @keyframes dashMove { to { stroke-dashoffset: -24; } }
  .nav-route { stroke: #ef4444; stroke-width: 3.5; stroke-dasharray: 6, 6; fill: none; stroke-linecap: round; stroke-linejoin: round; animation: dashMove 1s linear infinite; filter: drop-shadow(0 0 2px #ffffff); }
  @keyframes pulseRing { 0% { r: 6; opacity: 1; } 100% { r: 19; opacity: 0; } }
  .pulse-circle { fill: none; stroke: #ef4444; stroke-width: 2.8; animation: pulseRing 1.4s infinite; }
  
  .pin-group { cursor: pointer; transition: opacity 0.25s ease; }
  .pin-group.dimmed { opacity: 0.16; }

  .pin-label-bg { fill: var(--label-bg); stroke: none; rx: 3.5px; }
  .pin-label-text { font-size: 4.8px; font-weight: 700; fill: var(--label-text); text-anchor: middle; pointer-events: none; }
  .pin-group.done .pin-label-text { text-decoration: line-through; }

  .nav-banner { margin: 12px 16px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; border-radius: 14px; padding: 14px; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25); }
  .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 6px; flex-wrap: wrap; }
  .nav-time { background: #fff; color: #0369a1; font-weight: 800; padding: 2px 8px; border-radius: 6px; font-size: 0.82rem; }
  .nav-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .badge-dpa { background: #fbbf24; color: #000; }
  .badge-std { background: rgba(255,255,255,0.2); color: #fff; }
  .nav-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
  .nav-dir { display: flex; align-items: flex-start; gap: 8px; background: rgba(0,0,0,0.22); padding: 8px 10px; border-radius: 8px; font-size: 0.84rem; line-height: 1.4; }
  .dir-arrow { font-size: 1.25rem; line-height: 1; }
  .nav-tip { font-size: 0.78rem; color: #e0f2fe; margin-top: 8px; }

  .filter-bar { display: flex; gap: 6px; padding: 4px 16px 8px; overflow-x: auto; }
  .filter-btn { background: var(--card); color: var(--text-muted); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
  .filter-btn.active { background: var(--blue); color: #ffffff; border-color: var(--blue); }

  .timeline { padding: 0 16px; }
  .phase-title { font-size: 0.78rem; letter-spacing: 0.3px; color: var(--blue); margin: 14px 0 8px; font-weight: 700; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; transition: 0.2s; cursor: pointer; scroll-margin-top: 125px; }
  .card.selected { background: var(--card-active); border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
  .card.done { opacity: 0.55; }
  .card.done .item-name { text-decoration: line-through; }

  .check-box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #64748b; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-weight: bold; color: transparent; transition: 0.2s; }
  .card.done .check-box { background: var(--green); border-color: var(--green); color: #fff; }

  .card-body { flex: 1; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .time-tag { font-size: 0.78rem; font-weight: 700; color: var(--blue); }
  .tag-dpa { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold); font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: 700; }
  .tag-std { background: var(--blue-bg); color: var(--blue); font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
  .tag-food { background: var(--green-bg); color: var(--green); font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: 600; }
  .item-name { font-size: 0.94rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .item-zone { font-size: 0.76rem; color: var(--text-muted); margin-bottom: 4px; }
  .item-note { font-size: 0.79rem; color: var(--text-muted); line-height: 1.35; }
  /* สไตล์หน้าต่างการเดินทาง (Transit Modal) */
/* === [START: CSS แผนที่เดินทาง 3D ใหม่] === */
.transit-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(6px);
  z-index: 9999;
  justify-content: center;
  align-items: flex-end;
  font-family: -apple-system, BlinkMacSystemFont, 'Prompt', sans-serif;
}
.transit-modal.active { display: flex; }

/* ล็อกความสูงคงที่ 88vh ป้องกันภาพขยับขึ้นลงเวลาสลับโหมด */
.transit-sheet {
  background: #f8fafc;
  width: 100%;
  max-width: 540px;
  height: 88vh;
  max-height: 820px;
  border-radius: 24px 24px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
  animation: slideUpSheet 0.3s ease-out;
}
@keyframes slideUpSheet {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.transit-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  gap: 6px;
  flex-shrink: 0;
}
.transit-header h3 {
  margin: 0; font-size: 14.5px; color: #0f172a; font-weight: 700;
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-icon-group {
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
}
.header-circle-btn {
  background: #f1f5f9; border: 1px solid #e2e8f0;
  width: 32px; height: 32px; border-radius: 50%;
  font-size: 14px; color: #334155; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.header-circle-btn.active {
  background: #0f172a; color: #ffffff; border-color: #0f172a;
}
.header-driver-btn {
  background: #fef3c7; border: 1px solid #f59e0b;
  padding: 0 9px; height: 32px; border-radius: 16px;
  font-size: 11.5px; font-weight: 700; color: #92400e;
  cursor: pointer; display: flex; align-items: center; gap: 4px;
}

/* กรอบแผนที่ 3D และโหมดเต็มจอ */
.map-viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #38bdf8;
  overflow: hidden;
  flex-shrink: 0;
}
.map-viewport.fullscreen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  aspect-ratio: auto;
  z-index: 10005;
  background: #0f172a;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
}
.fs-close-btn {
  display: none;
  position: fixed;
  top: 16px;
  right: 16px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(8px);
  color: #ffffff;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  font-size: 18px;
  cursor: pointer;
  z-index: 10008;
  align-items: center;
  justify-content: center;
}
.map-viewport.fullscreen .fs-close-btn { display: flex; }

/* ปุ่มซูม +/- มุมขวาล่าง */
.map-zoom-controls {
  position: absolute;
  bottom: 10px;
  right: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  z-index: 20;
}
.zoom-mini-btn {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: rgba(15, 23, 42, 0.78);
  backdrop-filter: blur(6px);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* แคนวาสแผนที่ ล็อกจุดอ้างอิงที่มุมซ้ายบน (0 0) เพื่อการแพนที่ลื่นไหลไม่กระตุก */
.map-canvas {
  position: relative;
  width: 100%;
  height: 100%;
  transform-origin: 0 0;
  will-change: transform;
  transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
}
.map-viewport.fullscreen .map-canvas {
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
}
.map-bg-img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.map-svg-overlay {
  position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
}

/* ป้ายชื่อสถานที่ขนาดเล็กกะทัดรัด (7.5px) */
.map-pins-layer {
  position: absolute; inset: 0; pointer-events: none; transition: opacity 0.25s;
}
.map-pins-layer.hidden { opacity: 0; }

.map-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: rgba(15, 23, 42, 0.78);
  color: #ffffff;
  padding: 2px 6px;
  border-radius: 10px;
  font-size: 7.5px;
  font-weight: 600;
  letter-spacing: 0.1px;
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  transition: transform 0.3s ease, background 0.3s ease;
}
.map-pin.focused {
  background: #2563eb;
  transform: translate(-50%, -50%) scale(1.15);
  z-index: 15;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.6);
}
.map-pin.route-hidden {
  display: none !important;
}

/* วงแหวนไฟกระพริบชี้จุด */
.spotlight-ring {
  position: absolute;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 2px solid #facc15;
  background: rgba(250, 204, 21, 0.22);
  transform: translate(-50%, -50%);
  pointer-events: none;
  display: none;
  animation: pulseSpot 1.6s infinite;
}
@keyframes pulseSpot {
  0% { transform: translate(-50%, -50%) scale(0.75); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.75); opacity: 0; }
}

/* แถบสรุปเวลาออกเดินทาง */
.departure-banner {
  background: #fefce8;
  border-bottom: 1px solid #fef08a;
  color: #854d0e;
  padding: 7px 14px;
  font-size: 11.5px;
  font-weight: 600;
  text-align: center;
  flex-shrink: 0;
}

/* แถบสลับโหมดเดินทาง */
.mode-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 10px 14px; background: #ffffff; border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.mode-tab {
  padding: 8px 10px; border-radius: 12px; border: 1.5px solid #e2e8f0;
  background: #f8fafc; font-size: 12.5px; font-weight: 700; color: #475569;
  cursor: pointer; text-align: center; transition: all 0.2s;
}
.mode-tab.active.mtr {
  background: #eff6ff; border-color: #2563eb; color: #1d4ed8;
}
.mode-tab.active.car {
  background: #f0fdf4; border-color: #16a34a; color: #15803d;
}

/* รายการ Step */
.steps-container {
  padding: 10px 14px 28px; overflow-y: auto; flex: 1;
}
.step-card {
  background: #ffffff; border-radius: 14px; padding: 11px 13px;
  margin-bottom: 8px; border: 1.5px solid #e2e8f0;
  cursor: pointer; transition: all 0.25s;
}
.step-card.active {
  border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
}
.car-mode .step-card.active {
  border-color: #16a34a; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.12);
}
.step-header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.step-badge {
  width: 24px; height: 24px; border-radius: 50%; background: #2563eb;
  color: #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.car-mode .step-badge { background: #16a34a; }
.step-title { font-size: 13px; font-weight: 700; color: #1e293b; flex: 1; }
.step-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
.step-arrow {
  font-size: 11px; color: #94a3b8; transition: transform 0.25s;
}
.step-card.active .step-arrow {
  transform: rotate(180deg); color: #2563eb;
}
.step-details {
  display: none; margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed #cbd5e1; font-size: 12px; color: #334155; line-height: 1.6;
}
.step-card.active .step-details { display: block; }

.step-btn-group {
  display: flex; flex-direction: column; gap: 6px; margin-top: 10px;
}
.action-shortcut-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 12px; border-radius: 10px;
  background: #0f172a; color: #ffffff; font-size: 12px; font-weight: 600;
  text-decoration: none; border: none; cursor: pointer; width: 100%; justify-content: center;
}
.action-shortcut-btn.gold {
  background: #fef3c7; color: #92400e; border: 1px solid #f59e0b;
}

/* ป๊อปอัปย่อยสำหรับปุ่มลัด */
.sub-info-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
  z-index: 10010; justify-content: center; align-items: center; padding: 20px;
}
.sub-info-overlay.active { display: flex; }
.sub-info-box {
  background: #ffffff; border-radius: 20px; padding: 20px;
  width: 100%; max-width: 390px; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

let scale = 1, startScale = 1;
let translateX = 0, translateY = 0;
let lastTouchX = 0, lastTouchY = 0;
let isPanning = false;

const mapWrapper = document.getElementById('mapWrapper');
const parkMap = document.getElementById('parkMap');
const zoomInfo = document.getElementById('zoomInfo');

function isRotatedPortrait() {
  return isFullscreen && window.innerHeight > window.innerWidth;
}

function getLogicalDimensions() {
  if (isRotatedPortrait()) {
    return { w: window.innerHeight, h: window.innerWidth };
  }
  const rect = mapWrapper.getBoundingClientRect();
  return { w: rect.width, h: rect.height };
}

function updateTransform() {
  scale = Math.max(1, Math.min(scale, 5));
  const dim = getLogicalDimensions();
  const maxX = dim.w * (scale - 1);
  const maxY = dim.h * (scale - 1);
  translateX = Math.max(-maxX, Math.min(0, translateX));
  translateY = Math.max(-maxY, Math.min(0, translateY));
  
  parkMap.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  zoomInfo.innerText = `ซูม: ${Math.round(scale * 100)}%`;
}

mapWrapper.addEventListener('touchstart', (e) => {
  if (e.target.closest('#exitFsBtn') || e.target.closest('#zoomControls')) return;
  const touches = Array.from(e.touches);
  if (touches.length === 1) {
    isPanning = true;
    lastTouchX = touches[0].clientX;
    lastTouchY = touches[0].clientY;
  } else if (touches.length === 2) {
    isPanning = false;
    startScale = scale;
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    mapWrapper.dataset.dist = Math.sqrt(dx * dx + dy * dy);
  }
}, { passive: false });

mapWrapper.addEventListener('touchmove', (e) => {
  if (e.target.closest('#exitFsBtn') || e.target.closest('#zoomControls')) return;
  e.preventDefault();
  const touches = Array.from(e.touches);
  if (isPanning && touches.length === 1) {
    const rawDx = touches[0].clientX - lastTouchX;
    const rawDy = touches[0].clientY - lastTouchY;
    lastTouchX = touches[0].clientX;
    lastTouchY = touches[0].clientY;

    if (isRotatedPortrait()) {
      translateX += rawDy;
      translateY -= rawDx;
    } else {
      translateX += rawDx;
      translateY += rawDy;
    }
    updateTransform();
  } else if (touches.length === 2) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const startDist = parseFloat(mapWrapper.dataset.dist) || dist;
    scale = startScale * (dist / startDist);
    updateTransform();
  }
}, { passive: false });

mapWrapper.addEventListener('touchend', () => { isPanning = false; });

function zoom(amount) {
  const prevScale = scale;
  scale = Math.max(1, Math.min(scale + amount, 5));
  const dim = getLogicalDimensions();
  const ratio = scale / prevScale;
  translateX = (dim.w / 2) - ((dim.w / 2) - translateX) * ratio;
  translateY = (dim.h / 2) - ((dim.h / 2) - translateY) * ratio;
  updateTransform();
}

function resetZoom() {
  scale = 1; translateX = 0; translateY = 0;
  updateTransform();
}

function saveState() {
  localStorage.setItem('hkdl_done', JSON.stringify(completedIds));
  localStorage.setItem('hkdl_selected', selectedId);
}

function toggleDone(e, id) {
  e.stopPropagation();
  const step = itinerary.find(item => item.id === id);
  const isCurrentlyDone = completedIds.includes(id);

  if (!isCurrentlyDone) {
    if (!confirm(`ยืนยันว่าทำภารกิจที่ ${id} (${step.name}) สำเร็จแล้วใช่ไหม?`)) return;
    completedIds.push(id);
    const nextStep = itinerary.find(item => item.id > id && !completedIds.includes(item.id));
    if (nextStep) selectedId = nextStep.id;
  } else {
    if (!confirm(`ต้องการยกเลิกการติ๊กถูกภารกิจที่ ${id} (${step.name}) ใช่หรือไม่?`)) return;
    completedIds = completedIds.filter(item => item !== id);
  }
  saveState(); renderAll();
}

function selectStep(id, fromMap = false) {
  selectedId = id;
  saveState();

  if (fromMap) {
    const singleBtn = document.getElementById('filter-single');
    singleBtn.style.display = 'inline-block';
    singleBtn.innerText = `🎯 เฉพาะลำดับที่ ${id}`;
    currentFilter = 'single';
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    singleBtn.classList.add('active');
  }

  renderAll();

  if (fromMap && !isFullscreen) {
    setTimeout(() => {
      const cardEl = document.getElementById(`card-${id}`);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 80);
  }
}

  if (confirm('⚠️ คำเตือน: ต้องการล้างข้อมูลที่ติ๊กไว้และสิทธิ์บัตร Premier Access ทั้งหมดใช่หรือไม่?')) {

function renderRideChips() {
  const container = document.getElementById('rideChips');
  container.innerHTML = '';

  const visibleChips = rideChipCatalog.filter(chip => {
    if (drawerTab === 'premier') return chip.group === 'premier';
    if (drawerTab === 'normal') return chip.group === 'normal';
    return true;
  });

  visibleChips.forEach(chip => {
    const btn = document.createElement('button');
    const isSelected = highlightedRideKeys.includes(chip.key);
    btn.className = 'ride-chip' + (isSelected ? ' selected' : '');
    btn.innerText = chip.label;
    btn.onclick = () => toggleHighlightRide(chip.key, chip.defaultId);
    container.appendChild(btn);
  });
}

  const layer = document.getElementById('facilitiesLayer');
  layer.innerHTML = '';

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

    const dot = document.createElement('div');

function renderMap() {
  const routeLayer = document.getElementById('routeLayer');
  const pinsLayer = document.getElementById('pinsLayer');
  routeLayer.innerHTML = ''; pinsLayer.innerHTML = '';

  const currentIdx = itinerary.findIndex(i => i.id === selectedId);
  const currentStep = itinerary[currentIdx];
  const prevStep = currentIdx > 0 ? itinerary[currentIdx - 1] : { x: 200, y: 232 };

  if (!isExploreMode) {
    const pathData = currentStep.routePath || `M ${prevStep.x},${prevStep.y} L ${currentStep.x},${currentStep.y}`;
    const pathNode = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pathNode.setAttribute("d", pathData);
    pathNode.setAttribute("class", "nav-route");
    routeLayer.appendChild(pathNode);

    const points = pathData.trim().split(/[ML\s]+/).filter(Boolean);
    let arrowAngle = 0;
    if (points.length >= 2) {
      const prevPt = points[points.length - 2].split(',');
      const currPt = points[points.length - 1].split(',');
      const dx = parseFloat(currPt[0]) - parseFloat(prevPt[0]);
      const dy = parseFloat(currPt[1]) - parseFloat(prevPt[1]);
      arrowAngle = Math.atan2(dy, dx) * (180 / Math.PI);
    }
    
    const arrowDist = 13;
    const ax = currentStep.x - Math.cos(arrowAngle * Math.PI / 180) * arrowDist;
    const ay = currentStep.y - Math.sin(arrowAngle * Math.PI / 180) * arrowDist;
    
    const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    arrow.setAttribute("points", "-5,-4 5,0 -5,4");
    arrow.setAttribute("fill", "#ef4444");
    arrow.setAttribute("stroke", "#ffffff");
    arrow.setAttribute("stroke-width", "0.8");
    arrow.setAttribute("transform", `translate(${ax},${ay}) rotate(${arrowAngle})`);
    routeLayer.appendChild(arrow);
  }

  const hasSpecificRideSelected = highlightedRideKeys.length > 0;

  const isItemActiveOnMap = (item) => {
    if (hasSpecificRideSelected) {
      return highlightedRideKeys.includes(item.rideKey);
    }
    if (isExploreMode) {
      if (drawerTab === 'premier') return item.rideGroup === 'premier';
      if (drawerTab === 'normal') return item.rideGroup === 'normal';
    }
    return true;
  };

  const sortedPins = [...itinerary].sort((a, b) => {
    const aAct = isItemActiveOnMap(a) ? 1 : 0;
    const bAct = isItemActiveOnMap(b) ? 1 : 0;
    return aAct - bAct;
  });

  sortedPins.forEach(item => {
    const isDone = completedIds.includes(item.id);
    const isSelected = !isExploreMode && (item.id === selectedId);
    const isActive = isItemActiveOnMap(item);
    const isHighlighted = hasSpecificRideSelected && highlightedRideKeys.includes(item.rideKey);

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    let cls = "pin-group";
    if (isDone) cls += " done";
    if (!isActive) cls += " dimmed";
    g.setAttribute("class", cls);
    g.ontouchstart = (e) => { e.stopPropagation(); };
    g.onclick = (e) => { e.stopPropagation(); selectStep(item.id, true); };

    if (isSelected || isHighlighted) {
      const pulse = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      pulse.setAttribute("cx", item.x); pulse.setAttribute("cy", item.y);
      pulse.setAttribute("class", "pulse-circle"); g.appendChild(pulse);
    }

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", item.x); circle.setAttribute("cy", item.y);
    circle.setAttribute("r", (isSelected || isHighlighted) ? "7.8" : "5.8");
    
    let fill = "#0284c7";
    if (item.type === 'dpa') fill = "#f59e0b";
    if (item.type === 'food') fill = "#10b981";
    if (isDone) fill = "#64748b";

    circle.setAttribute("fill", fill); circle.setAttribute("stroke", "#ffffff");
    circle.setAttribute("stroke-width", (isSelected || isHighlighted) ? "2" : "1.2"); g.appendChild(circle);

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", item.x); text.setAttribute("y", item.y + 2.3);
    text.setAttribute("text-anchor", "middle"); text.setAttribute("font-size", "7");
    text.setAttribute("font-weight", "bold"); text.setAttribute("fill", "#ffffff");
    text.textContent = isDone ? "✓" : item.id; g.appendChild(text);

    const labelY = item.y - 11;
    const txtLen = item.shortName.length * 2.6 + 10;
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", item.x - (txtLen / 2)); rect.setAttribute("y", labelY - 4.8);
    rect.setAttribute("width", txtLen); rect.setAttribute("height", 7.8);
    rect.setAttribute("class", "pin-label-bg"); g.appendChild(rect);

    const lblText = document.createElementNS("http://www.w3.org/2000/svg", "text");
    lblText.setAttribute("x", item.x); lblText.setAttribute("y", labelY + 1.1);
    lblText.setAttribute("class", "pin-label-text");
    lblText.textContent = `${item.id}. ${item.shortName}`; g.appendChild(lblText);

    pinsLayer.appendChild(g);
  });
}

function renderTimeline() {
  const container = document.getElementById('timelineContainer');
  container.innerHTML = '';
  let currentPhase = '';

  const filteredList = itinerary.filter(item => {
    if (currentFilter === 'highlighted') return highlightedRideKeys.includes(item.rideKey);
    if (currentFilter === 'single') return item.id === selectedId;
    if (currentFilter === 'dpa') return item.type === 'dpa';
    if (currentFilter === 'normal') return item.rideGroup === 'normal';
    if (currentFilter === 'todo') return !completedIds.includes(item.id);
    return true;
  });

  if (filteredList.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 30px; color: var(--text-muted);">🎉 เก็บครบทุกรายการในหมวดนี้แล้ว!</div>`;
    return;
  }

  filteredList.forEach(item => {
    if (item.phase !== currentPhase) {
      currentPhase = item.phase;
      const pDiv = document.createElement('div');
      pDiv.className = 'phase-title'; pDiv.innerHTML = `📍 ${currentPhase}`;
      container.appendChild(pDiv);
    }

    const isDone = completedIds.includes(item.id);
    const isSelected = item.id === selectedId;

    let tagHtml = `<span class="tag-std">ต่อคิวปกติ</span>`;
    if (item.type === 'dpa') tagHtml = `<span class="tag-dpa">⚡ Premier Access #${item.dpaNum}</span>`;
    if (item.type === 'food') tagHtml = `<span class="tag-food">🍽️ พักกลางวัน</span>`;

    const card = document.createElement('div');
    card.id = `card-${item.id}`;
    card.className = `card ${isSelected ? 'selected' : ''} ${isDone ? 'done' : ''}`;
    card.onclick = () => selectStep(item.id, false);

    card.innerHTML = `
      <div class="check-box" onclick="toggleDone(event, ${item.id})">✓</div>
      <div class="card-body">
        <div class="card-top">
          <span class="time-tag">${item.time} • ลำดับที่ ${item.id}</span>
          ${tagHtml}
        </div>
        <div class="item-name">${item.name}</div>
        <div class="item-zone">โซน: ${item.zone}</div>
        <div class="item-note">${item.note}</div>
      </div>
    `;
    container.appendChild(card);
  });

  if (currentFilter === 'single' || currentFilter === 'highlighted' || currentFilter === 'normal') {
    const showAllBtn = document.createElement('button');
    showAllBtn.className = 'filter-btn';
    showAllBtn.style.cssText = 'width: 100%; padding: 10px; margin-top: 4px; text-align: center;';
    showAllBtn.innerText = '📋 แสดงตารางเวลาทั้งหมด (14 รายการ)';
    showAllBtn.onclick = () => {
      document.getElementById('rideDrawer').classList.remove('open');
      clearHighlightRides();
    };
    container.appendChild(showAllBtn);
  }
}

let gpsWatcher = null;
let isTrackingGPS = false;

function toggleGPS() {
  const btn = document.getElementById('gpsBtn');
  if (!isTrackingGPS) {
    if ("geolocation" in navigator) {
      isTrackingGPS = true;
      btn.innerText = "📍 กำลังระบุตำแหน่ง...";
      btn.style.background = "#059669";
      
      const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
      gpsWatcher = navigator.geolocation.watchPosition(updateGPSMarker, handleGPSError, options);
    } else {
      alert("เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง");
    }
  } else {
    stopGPS(btn);
  }
}

function updateGPSMarker(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const btn = document.getElementById('gpsBtn');

  // เช็กว่าพิกัดอยู่นอกเขตฮ่องกงดิสนีย์แลนด์หรือไม่
  if (lat < 22.3050 || lat > 22.3220 || lon < 114.0320 || lon > 114.0520) {
    if (btn) btn.innerText = "📍 คุณอยู่นอกเขตสวนสนุก";
    const gpsGroup = document.getElementById('gps-user-group');
    if (gpsGroup) gpsGroup.remove(); // ลบจุดสีฟ้าออก ไม่ให้ค้างกลางแผนที่
    return;
  }

  if (btn) btn.innerText = "📍 กำลังติดตามตำแหน่ง";

  // พิกัดอ้างอิง 5 จุด และตำแหน่ง X,Y บน SVG (400x250)
  const anchors = [
    { name: 'NW', lat: 22.3160, lon: 114.0380, x: 25, y: 15 },
    { name: 'NE', lat: 22.3160, lon: 114.0450, x: 385, y: 55 },
    { name: 'SW', lat: 22.3100, lon: 114.0380, x: 20, y: 240 },
    { name: 'SE', lat: 22.3100, lon: 114.0450, x: 385, y: 185 },
    { name: 'C',  lat: 22.3130, lon: 114.0415, x: 200, y: 115 }
  ];
  // ... (โค้ดส่วนคำนวณและวาดหมุดด้านล่างคงเดิม) ...

  let totalWeight = 0;
  let simulatedX = 0;
  let simulatedY = 0;

  anchors.forEach(anchor => {
    const dLat = lat - anchor.lat;
    const dLon = lon - anchor.lon;
    const weight = 1 / (dLat * dLat + dLon * dLon + 0.0000001);
    simulatedX += anchor.x * weight;
    simulatedY += anchor.y * weight;
    totalWeight += weight;
  });

  simulatedX /= totalWeight;
  simulatedY /= totalWeight;

  const pinsLayer = document.getElementById('pinsLayer');
  let gpsGroup = document.getElementById('gps-user-group');

  if (!gpsGroup) {
    gpsGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
    gpsGroup.id = "gps-user-group";

    const pulse = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    pulse.id = "gps-pulse-circle";
    pulse.setAttribute("r", "25");
    pulse.setAttribute("fill", "url(#gpsPulse)");
    gpsGroup.appendChild(pulse);

    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.id = "gps-dot-circle";
    dot.setAttribute("r", "8");
    dot.setAttribute("fill", "#2563eb");
    dot.setAttribute("stroke", "#ffffff");
    dot.setAttribute("stroke-width", "2");
    gpsGroup.appendChild(dot);

    pinsLayer.appendChild(gpsGroup);
  }

  gpsGroup.setAttribute("transform", `translate(${simulatedX}, ${simulatedY})`);
}

function handleGPSError(err) {
  console.warn(`GPS Error (${err.code}): ${err.message}`);
  const btn = document.getElementById('gpsBtn');
  if(btn) btn.innerText = "📍 สัญญาณ GPS ขัดข้อง";
}

function stopGPS(btn) {
  if (gpsWatcher !== null) {
    navigator.geolocation.clearWatch(gpsWatcher);
    gpsWatcher = null;
  }
  isTrackingGPS = false;
  btn.innerText = "📍 แสดงตำแหน่งฉัน";
  btn.style.background = "#10b981";
  const gpsGroup = document.getElementById('gps-user-group');
  if (gpsGroup) gpsGroup.remove();
}

document.addEventListener("visibilitychange", () => {

    if (gpsWatcher !== null) {

      gpsWatcher = null;
    }
  } else if (isTrackingGPS && gpsWatcher === null) {
    const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
    gpsWatcher = navigator.geolocation.watchPosition(updateGPSMarker, handleGPSError, options);
  }

  if (!mode) {
    container.innerHTML = `
      <div style="text-align:center; padding:32px 16px; color:#64748b; font-size:12.5px; line-height:1.6;">
        👆 แตะเลือกปุ่ม <b>รถไฟฟ้า MTR</b> หรือ <b>UberXL / แท็กซี่</b> ด้านบน<br>เพื่อดูเส้นทางวิ่งและขั้นตอนเดินทางสำหรับ 5 ท่านครับ
      </div>`;
    return;
  }

  container.className = mode === 'car' ? 'steps-container car-mode' : 'steps-container';
  container.innerHTML = transitData[mode].map((item, idx) => `
    <div class="step-card" id="stepCard-${idx}" onclick="selectStep(${idx})">
      <div class="step-header">
        <div class="step-badge">${item.step}</div>
        <div style="flex:1;">
          <div class="step-title">${item.title}</div>
          <div class="step-sub">${item.sub}</div>
        </div>
        <span class="step-arrow">▼</span>
      </div>
      <div class="step-details" onclick="event.stopPropagation()">
        <div>${item.tip}</div>
        <div class="step-btn-group">
          ${item.buttons.map(b => `
            <button class="action-shortcut-btn ${b.style || ''}" onclick="${b.action}">${b.text}</button>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function selectStep(idx) {
  if (!currentMode) return;
  if (activeStepIdx === idx) {
    resetCamera();
    return;
  }

  activeStepIdx = idx;
  const item = transitData[currentMode][idx];

  document.querySelectorAll('.step-card').forEach((card, i) => {
    card.classList.toggle('active', i === idx);
  });

  document.querySelectorAll('.map-pin').forEach(p => p.classList.remove('focused'));
  if (item.pinId) {
    const targetPin = document.getElementById(item.pinId);
    if (targetPin) targetPin.classList.add('focused');
  }

  camState = { scale: item.cam.scale, x: item.cam.x, y: item.cam.y };
  applyCamera();

  const ring = document.getElementById('spotlightRing');
  ring.style.top = item.spot.top;
  ring.style.left = item.spot.left;
  ring.style.display = 'block';
}

function applyCamera() {
  const canvas = document.getElementById('mapCanvas');
  canvas.style.transform = `translate(${camState.x}%, ${camState.y}%) scale(${camState.scale})`;
}

function resetCamera() {
  activeStepIdx = null;
  camState = { scale: 1, x: 0, y: 0 };
  applyCamera();
  document.getElementById('spotlightRing').style.display = 'none';
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.map-pin').forEach(p => p.classList.remove('focused'));
}

// ปุ่มซูม +/- ซูมเข้า-ออก ณ ตำแหน่งที่กำลังดูอยู่โดยไม่ดีดหนี
function manualZoom(delta) {
  const newScale = Math.min(2.2, Math.max(1, camState.scale + delta));
  if (newScale === 1) {
    resetCamera();
    return;
  }
  const scaleDiff = newScale - camState.scale;
  camState.scale = newScale;
  // ปรับชดเชยพิกัดเล็กน้อยให้ซูมลึกเข้าไปตรงจุดเดิม
  camState.x = Math.min(0, Math.max(-((newScale - 1) * 100), camState.x - (scaleDiff * 45)));
  camState.y = Math.min(0, Math.max(-((newScale - 1) * 100), camState.y - (scaleDiff * 45)));
  applyCamera();
}

function toggleMapPins() {
  pinsVisible = !pinsVisible;
  document.getElementById('mapPinsLayer').classList.toggle('hidden', !pinsVisible);
  document.getElementById('togglePinsBtn').classList.toggle('active', pinsVisible);
}

function toggleMapFullscreen() {
  const vp = document.getElementById('mapViewport');
  const isFs = vp.classList.toggle('fullscreen');
  if (isFs) resetCamera();
}
